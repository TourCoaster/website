[build]
  command = "node scripts/prefetch-discovery.mjs && PREFETCH_DISCOVERY=0 jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.1.2"
  NODE_VERSION = "20"
  JEKYLL_ENV = "production"
  DISCOVERY_API_URL = "https://api.tourcoaster.com/v1/sitemap-data"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "node scripts/prefetch-discovery.mjs && PREFETCH_DISCOVERY=0 jekyll build"

[context.preview]
  command = "node scripts/prefetch-discovery.mjs && jekyll build --drafts --future"

[context.branch-deploy]
  command = "node scripts/prefetch-discovery.mjs && jekyll build --drafts --future"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
