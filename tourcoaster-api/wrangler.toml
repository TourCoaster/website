name = "tourcoaster-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Routes: production. The same Worker serves the API on api.tourcoaster.com
# AND the server-rendered public guide pages on tourcoaster.com/guides/*
# (overriding the static Jekyll output for that path). Uncomment and adjust
# zone_name once DNS is set up; in development `wrangler dev` ignores routes.
routes = [
  { pattern = "api.tourcoaster.com/*", zone_name = "tourcoaster.com" },
  { pattern = "tourcoaster.com/guides/*", zone_name = "tourcoaster.com" },
  { pattern = "tourcoaster.com/tours/*", zone_name = "tourcoaster.com" },
  { pattern = "tourcoaster.com/watch/*", zone_name = "tourcoaster.com" }
]

# ---------------------------------------------------------------------------
# Bindings — replace the placeholder IDs with the real ones from
# `wrangler d1 create tourcoaster`, `wrangler kv:namespace create ...`,
# and `wrangler r2 bucket create tourcoaster-media`.
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "tourcoaster"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_KV_ID"
preview_id = "REPLACE_WITH_SESSIONS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "FLAGS"
id = "REPLACE_WITH_FLAGS_KV_ID"
preview_id = "REPLACE_WITH_FLAGS_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tourcoaster-media"
preview_bucket_name = "tourcoaster-media-preview"

# ---------------------------------------------------------------------------
# Public configuration. Secrets (STRIPE_SECRET_KEY, STREAM_API_TOKEN, etc.)
# are set via `wrangler secret put NAME` — never put them here.
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
PUBLIC_SITE_ORIGIN = "http://localhost:5000"
# Cloudflare Access — set per environment. Not secrets, but required for auth.
CF_ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
CF_ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
# R2 / media. Account ID + bucket name are public; access keys are secrets
# (see .dev.vars.example). R2_PUBLIC_BASE is the URL prefix used to render
# absolute media URLs in HTML (typically the API origin so /v1/media works).
R2_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET_NAME = "tourcoaster-media"
R2_PUBLIC_BASE = "https://api.tourcoaster.com"

# Stripe — secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) go through
# `wrangler secret put`. Price IDs and the platform fee are non-secret config.
# 1500 bps = 15% platform fee on every in-person booking.
PLATFORM_FEE_BPS = "1500"
STRIPE_PRICE_EXPLORER = "price_REPLACE_WITH_EXPLORER_PRICE_ID"
STRIPE_PRICE_WANDERER = "price_REPLACE_WITH_WANDERER_PRICE_ID"

# Cloudflare Stream. CF_ACCOUNT_ID is your Cloudflare account id; the
# STREAM_CUSTOMER_CODE is the `customer-<code>` subdomain assigned by Stream.
# Secrets (STREAM_API_TOKEN, STREAM_WEBHOOK_SECRET, STREAM_SIGNING_KEY_ID,
# STREAM_SIGNING_PEM, STREAM_KEY_SECRET) go through `wrangler secret put`.
CF_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
STREAM_CUSTOMER_CODE = "customer-REPLACE"

# ---------------------------------------------------------------------------
# Durable Object — LiveTourRoom (one instance per live_streams row).
# Tracks viewer counts, fans out chat messages, and pushes status changes.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "LIVE_ROOMS"
class_name = "LiveTourRoom"

[[migrations]]
tag = "v1"
new_classes = ["LiveTourRoom"]
