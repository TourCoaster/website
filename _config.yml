baseurl: ""
url: "https://tourcoaster.com"
permalink: "/:title"

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-archives

collections:
  authors:
    output: true
  shop_items:
    output: true
    permalink: /shop/:name
  portfolio:
    output: true
    permalink: /portfolio/:name
  guides:
    output: true
    permalink: "/guides/:path/"
  tours:
    output: true
    permalink: "/tours/:path/"
  vr_experiences:
    output: true
    permalink: "/vr/:path/"

defaults:
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide-profile"
  - scope:
      path: ""
      type: "tours"
    values:
      layout: "tour-detail"
  - scope:
      path: ""
      type: "vr_experiences"
    values:
      layout: "vr-detail"

############################################################
pagination:
  enabled: true
  debug: false
  collection: 'posts'
  per_page: 9
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2
  extension: html
  indexpage: 'index'

############################################################
jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: tag
    category: category
  permalinks:
    tag: '/tag/:name/'
    category: '/category/:name/'

feed:
  collections:
    posts:
      path: "/index.xml"

highlighter: rouge
