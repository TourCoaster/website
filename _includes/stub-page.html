{% comment %} Reusable placeholder hero used by stub pages awaiting their backend wiring. {% endcomment %}
<div class="wrapper light-wrapper page-title-wrapper">
  <div class="container inner text-center">
    <h1 class="page-title">{{ include.title }}</h1>
    {% if include.subtitle %}<p class="lead">{{ include.subtitle }}</p>{% endif %}
  </div>
</div>

<div class="wrapper white-wrapper">
  <div class="container inner">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        {{ include.body }}
        {% if include.cta_url and include.cta_text %}
        <div class="space20"></div>
        <a href="{{ include.cta_url }}" class="btn btn-primary btn-lg rounded-pill">{{ include.cta_text }}</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
