<div class="card shadow-lg h-100" style="background: #1a1a2e; color: #fff;">
  {% if include.vr.image %}
  <figure class="card-img-top position-relative" style="margin:0;">
    <img src="{{ include.vr.image }}" alt="{{ include.vr.title }}" style="width:100%; height:200px; object-fit:cover; opacity:0.8;" />
    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="btn btn-circle btn-sm btn-primary"><i class="jam jam-play"></i></span>
    </div>
    <span class="badge bg-primary position-absolute" style="top:10px; right:10px; border-radius:20px;">
      <i class="jam jam-camera"></i> VR
    </span>
  </figure>
  {% endif %}
  <div class="card-body p-4">
    <h5 class="mb-1" style="color:#fff;">{{ include.vr.title }}</h5>
    <p class="mb-2" style="color:rgba(255,255,255,0.6);"><small><i class="jam jam-map-marker"></i> {{ include.vr.location }}</small></p>
    <p class="mb-3" style="color:rgba(255,255,255,0.7);"><small>{{ include.vr.description | truncate: 100 }}</small></p>
    <div class="d-flex justify-content-between align-items-center">
      <span style="color:rgba(255,255,255,0.6);"><i class="jam jam-clock"></i> {{ include.vr.duration }}</span>
      {% if include.vr.accessibility == "full" %}
      <small style="color:#4CAF50;"><i class="jam jam-heart"></i> Fully Accessible</small>
      {% endif %}
    </div>
  </div>
  <div class="card-footer p-4 pt-0" style="border:none; background:none;">
    <a href="/vr/{{ include.vr.slug }}" class="btn btn-sm btn-primary">Experience</a>
  </div>
</div>
